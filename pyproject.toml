[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sardi"
version = "1.0.0"
description = "Self-Augmenting Retrieval for Diffusion Language Models (ICML 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Paul Jünger" }]
keywords = ["diffusion language models", "retrieval-augmented generation", "multi-hop QA"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# flash-attn is a hard requirement but is installed separately, because it must
# build against your torch:
#     pip install flash-attn==2.8.3 --no-build-isolation
dependencies = [
    "torch==2.9.1",               # tested with 2.9.1+cu128
    "transformers==4.57.0",
    "accelerate==1.13.0",
    "safetensors==0.7.0",
    "huggingface-hub==0.36.2",
    # Retrieval
    "bm25s==0.2.14",
    "numba==0.64.0",              # bm25s numba backend; required
    "filelock==3.25.2",           # guards concurrent index build/load
    # Data
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "numpy==2.4.3",
    "tqdm==4.67.3",
]

[project.urls]
Paper = "https://arxiv.org/abs/2606.06474"
Repository = "https://github.com/pauljngr/SARDI"

[tool.setuptools.packages.find]
include = ["sardi*"]
